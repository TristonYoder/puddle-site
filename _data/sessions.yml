# Joke "Sessions" in the sidebar. Clicking one plays this fake transcript in the terminal pane.
# `os` is a platform key from _includes/os-icon.html (same marks as the app). Nothing connects anywhere. `key` is a made-up fingerprint fragment; `out` may have several lines.
- name: raspberrypi
  os: raspberrypi
  user: pi
  key: "r4sPb3rRy/pI+0wGl7u"
  lines:
    - cmd: uptime
      out: " 22:31  up 413 days,  1 user,  load average: 0.00, 0.00, 0.00"
    - cmd: vcgencmd measure_temp
      out: "temp=71.3'C"
    - cmd: echo "it's fine"
      out: "it's fine"
