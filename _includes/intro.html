{%- comment -%} The app's launch screen: clouds drift, the plane becomes a ">_" prompt, the page is revealed. CSS only, once per session. {%- endcomment -%}
<div class="intro" aria-hidden="true">
<svg viewBox="0 0 512 512" width="260" height="260" focusable="false">
<defs><g id="cl"><rect x="0" y="-26" width="150" height="26" rx="13"/><circle cx="48" cy="-30" r="30"/><circle cx="92" cy="-38" r="38"/><circle cx="124" cy="-24" r="22"/></g></defs>
<g class="i-clouds">
<use href="#cl" class="icl icl1" transform="translate(300 150) scale(.8)"/>
<use href="#cl" class="icl icl2" transform="translate(20 400) scale(1.2)"/>
<use href="#cl" class="icl icl3" transform="translate(330 470) scale(1.5)"/>
<use href="#cl" class="icl icl4" transform="translate(-40 210) scale(1)"/>
</g>
<g class="i-plane">
<g stroke-width="12" stroke-linecap="round" fill="none" style="stroke:var(--mint)"><path d="M130 256H40" opacity=".9"/><path d="M120 214H70" opacity=".5"/><path d="M122 298H84" opacity=".5"/></g>
<path d="M390 256L150 180L215 256L150 332Z" stroke-width="22" stroke-linejoin="round" style="fill:var(--mint);stroke:var(--mint)"/>
</g>
<g class="i-prompt">
<path d="M133 169L220 256L133 343" fill="none" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--mint)"/>
<rect class="i-cursor" x="277" y="297" width="112" height="46" rx="23" style="fill:var(--mint)"/>
</g>
</svg>
</div>
