<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
{% if page.intro %}{% include intro.html %}{% endif %}
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
<main id="main" class="reveal">
{{ content }}
</main>
{% include footer.html %}
<script>
(function(){var b=document.getElementById('theme-toggle');if(!b)return;var d=document.documentElement,o=['auto','light','dark'];
function cur(){return d.getAttribute('data-theme')||'auto'}
function paint(){var c=cur();b.querySelector('.tt-label').textContent=c.charAt(0).toUpperCase()+c.slice(1);b.setAttribute('aria-label','Color theme: '+c+'. Activate to change.');b.setAttribute('data-mode',c)}
b.addEventListener('click',function(){var n=o[(o.indexOf(cur())+1)%3];if(n==='auto')d.removeAttribute('data-theme');else d.setAttribute('data-theme',n);try{if(n==='auto')localStorage.removeItem('pj-theme');else localStorage.setItem('pj-theme',n)}catch(e){}paint()});
paint()})();
</script>
</body>
</html>
