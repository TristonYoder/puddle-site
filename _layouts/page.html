---
layout: default
---
<div class="wrap prose-wrap">
<article class="prose">
<h1>{{ page.title }}</h1>
{%- assign eff = site.legal[page.effective_key] -%}
{%- if eff %}<p class="meta">Effective {{ eff }}{% if page.applies %} &middot; {{ page.applies }}{% endif %}</p>{% endif %}
{%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
{{ content }}
</article>
</div>
